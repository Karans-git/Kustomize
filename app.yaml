apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  labels:
    app: jenkins
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      containers:
        - name: jenkins
          image: jenkins/jenkins:lts-jdk17
          ports:
            - containerPort: 8080       # Web UI
            - containerPort: 50000      # Agent (JNLP)
          volumeMounts:
            - name: jenkins-home
              mountPath: /var/jenkins_home
          env:
            # Disable setup wizard
            - name: JAVA_OPTS
              value: "-Djenkins.install.runSetupWizard=false"

            # Force ports explicitly
            - name: JENKINS_PORT
              value: "8080"
            - name: JENKINS_SLAVE_AGENT_PORT
              value: "50000"
      volumes:
        - name: jenkins-home
          persistentVolumeClaim:
            claimName: jenkins-pvc
