apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels:
    app: mysql
spec:
  type: ClusterIP  # Internal-only service type
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306         # The port your backend will use to connect to MySQL
      targetPort: 3306   # The port exposed by the MySQL container

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: abc@1234
            - name: MYSQL_DATABASE
              value: todo_app
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
            - name: mysql-schema
              mountPath: /docker-entrypoint-initdb.d   # <== schema goes here
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: mysql-pvc
        - name: mysql-schema
          configMap:                                  # Or secret/custom volume
            name: mysql-schema
---

apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-schema
data:
  schema.sql: |
    CREATE TABLE IF NOT EXISTS tasks (
      id INT AUTO_INCREMENT PRIMARY KEY,
      title VARCHAR(255) NOT NULL,
      description TEXT,
      completed BOOLEAN DEFAULT FALSE,
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
